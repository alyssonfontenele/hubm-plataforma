name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    needs: [] # roda em paralelo com security-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica isolamento de supabase/migrations/ (exclusiva Mowig)
        run: |
          set -e
          BAD_SCOPE=$(grep -L -iE '^-- projeto: .*mowig' supabase/migrations/*.sql || true)
          if [ -n "$BAD_SCOPE" ]; then
            echo "Migration em supabase/migrations/ sem 'mowig' no cabeçalho -- projeto::"
            echo "$BAD_SCOPE"
            exit 1
          fi
          MISSING_HEADER=$(grep -L -iE '^-- projeto: ' supabase/migrations/*.sql supabase/core/migrations/*.sql supabase/moveria/migrations/*.sql 2>/dev/null || true)
          if [ -n "$MISSING_HEADER" ]; then
            echo "Migration sem a linha '-- projeto: ...' no cabeçalho:"
            echo "$MISSING_HEADER"
            exit 1
          fi

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run
        env:
          SKIP_INTEGRATION_TESTS: "true"
